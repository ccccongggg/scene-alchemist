<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="MU9uhXuYNDektr1Gup7A9m">
<head data-page-node-id="r8gMNCpEZMvaxyb7TvqHqe">
<meta charset="utf-8" data-page-node-id="FCNklFEo2C1RqQCEpaQqCw">

<title>场景炼金师 · 星辰图（一帖千面）</title>
<style>
  :root{
    --ink:#0A0B0F; --panel:#141620; --panel2:#1B1E29; --line:#262A36;
    --t1:#E9E7E2; --t2:#9A968E; --t3:#6B6862;
    --gold:#E7B873;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 760px at 32% -12%, #13162a 0%, #0A0B0F 60%);
    color:var(--t1);
    font:14px/1.6 "PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC",
         "MiSans","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }
  .app{display:flex; flex-direction:column; height:100vh; min-height:760px; position:relative}

  header{
    display:flex; align-items:center; gap:18px; padding:14px 22px;
    border-bottom:1px solid var(--line); background:rgba(10,11,15,.7); backdrop-filter:blur(8px);
  }
  .brand{font-size:15px; font-weight:500; letter-spacing:.5px}
  .brand b{color:var(--gold); font-weight:500}
  .posts{display:flex; gap:8px; margin-left:6px}
  .post-chip{
    padding:6px 12px; border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2); font-size:12px; cursor:pointer; transition:.2s; white-space:nowrap; font-family:inherit;
  }
  .post-chip:hover{color:var(--t1); border-color:#3A3F4E}
  .post-chip.on{color:#1A1508; background:var(--gold); border-color:var(--gold)}
  .spacer{flex:1}
  .grow-btn{
    padding:7px 14px; border:1px solid var(--gold); border-radius:8px; background:transparent;
    color:var(--gold); font-size:12.5px; cursor:pointer; transition:.2s; font-family:inherit; white-space:nowrap;
  }
  .grow-btn:hover{background:var(--gold); color:#1A1508}
  .grow-btn:disabled{opacity:.4; cursor:default; background:transparent; color:var(--gold)}
  .browse-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 14px; border:1px solid var(--line); border-radius:8px; background:transparent;
    color:var(--t2); font-size:12.5px; cursor:pointer; transition:.2s; font-family:inherit; white-space:nowrap;
  }
  .browse-btn:hover{color:var(--t1); border-color:#3A3F4E; background:rgba(32,35,46,.55)}
  .browse-btn b{color:var(--gold); font-weight:600}

  /* 已收录场景 抽屉 */
  .drawer{
    position:absolute; top:0; right:0; height:100%; width:430px; max-width:84vw; z-index:20;
    background:linear-gradient(180deg,#111319,#0B0C11); border-left:1px solid var(--line);
    transform:translateX(103%); transition:transform .42s cubic-bezier(.22,1,.36,1);
    display:flex; flex-direction:column; box-shadow:-26px 0 70px rgba(0,0,0,.55);
  }
  .drawer.open{transform:none}
  .drawer-hd{display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line)}
  .drawer-hd .dt{font-size:14px; font-weight:500; letter-spacing:.3px}
  .drawer-hd .ds{font-size:11.5px; color:var(--t3); margin-top:2px}
  .drawer-hd .dclose{
    margin-left:auto; width:30px; height:30px; flex:0 0 30px; border-radius:8px; border:1px solid var(--line);
    background:transparent; color:var(--t2); cursor:pointer; font-size:14px; line-height:1; font-family:inherit; transition:.18s;
  }
  .drawer-hd .dclose:hover{color:var(--t1); border-color:#3A3F4E; background:rgba(32,35,46,.7)}
  .drawer-list{flex:1; overflow-y:auto; padding:8px 12px 28px}
  .drawer-list::-webkit-scrollbar{width:6px}
  .drawer-list::-webkit-scrollbar-thumb{background:#2A2E3A; border-radius:3px}
  .dgrp{font-size:11px; letter-spacing:1.5px; color:var(--t3); padding:16px 8px 7px}
  .drow{
    display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:10px;
    border:1px solid transparent; cursor:pointer; transition:.16s; margin-bottom:3px;
  }
  .drow:hover{background:var(--panel2); border-color:var(--line)}
  .drow.on{background:var(--panel2); border-color:var(--gold)}
  .ddot{width:9px; height:9px; border-radius:50%; flex:0 0 9px; border:1.6px solid var(--dc); background:transparent}
  .ddot.v{background:var(--dc)}
  .drow .dn{font-size:13px; color:var(--t1)}
  .drow .dm{margin-left:auto; font-size:11px; color:var(--t3); white-space:nowrap}

  main{flex:1; display:flex; min-height:0}
  .stage{flex:1; position:relative; min-width:0; overflow:hidden}
  /* 星海背景 */
  .space{position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(620px 420px at 78% 18%, rgba(91,155,213,.10), transparent 60%),
      radial-gradient(520px 380px at 18% 82%, rgba(231,184,115,.08), transparent 60%),
      radial-gradient(900px 600px at 50% 50%, rgba(40,46,80,.18), transparent 70%);}
  .bgstars{position:absolute; inset:0; width:100%; height:100%}
  svg#web{position:relative; z-index:1; width:100%; height:100%; display:block}

  aside{
    width:472px; flex:0 0 472px; border-left:1px solid var(--line);
    background:linear-gradient(180deg,#101219,#0C0D13); overflow-y:auto; padding:20px; z-index:2;
  }
  aside::-webkit-scrollbar{width:6px}
  aside::-webkit-scrollbar-thumb{background:#2A2E3A; border-radius:3px}

  @keyframes reveal{from{opacity:0; transform:translateY(9px)}to{opacity:1; transform:none}}
  .reveal{animation:reveal .44s cubic-bezier(.22,1,.36,1) both}
  @keyframes popin{from{opacity:0; transform:scale(.94)}to{opacity:1; transform:none}}
  .popin{animation:popin .5s cubic-bezier(.22,1,.36,1) both}

  .kicker{font-size:11.5px; letter-spacing:2px; color:var(--t3)}
  .p-title{font-size:19px; font-weight:500; margin:8px 0 4px; line-height:1.45; letter-spacing:.3px}
  .p-origin{font-size:13.5px; color:var(--t2); margin:0 0 14px; line-height:1.75}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
  .tag{font-size:11.5px; color:var(--t2); border:1px solid var(--line); border-radius:6px; padding:3px 8px}
  .sec{margin:18px 0 8px; font-size:12px; color:var(--t3); letter-spacing:1px}
  .bar-row{display:flex; align-items:center; gap:10px; margin:7px 0}
  .bar-name{width:82px; font-size:12px; color:var(--t2); flex:0 0 82px; text-align:right}
  .bar-track{flex:1; height:6px; background:#1C1F29; border-radius:3px; overflow:hidden}
  .bar-fill{height:100%; border-radius:3px}
  .bar-num{width:22px; font-size:12px; color:var(--t3); text-align:right; flex:0 0 22px}
  .diff-tb{width:100%; border-collapse:collapse; font-size:13px; margin-top:4px}
  .diff-tb th{text-align:left; color:var(--t3); font-weight:400; padding:5px 6px; border-bottom:1px solid var(--line)}
  .diff-tb td{padding:7px 6px; border-bottom:1px solid #1C1F29; color:var(--t2); vertical-align:top}
  .diff-tb td.dim{color:var(--t1); white-space:nowrap}
  .diff-tb td.mine{color:var(--gold)}
  .moves{margin:0; padding:0; list-style:none}
  .moves li{position:relative; padding:9px 0 9px 24px; font-size:13.5px; color:var(--t2); border-bottom:1px solid #1C1F29; line-height:1.7}
  .moves li:last-child{border-bottom:0}
  .moves li:before{content:""; position:absolute; left:6px; top:15px; width:6px; height:6px; border-radius:50%; background:var(--gold)}
  .moves li b{color:var(--t1); font-weight:500; display:block; margin-bottom:2px; font-size:13px}
  .stat-line{display:flex; gap:18px; margin:12px 0 4px}
  .stat{flex:1}
  .stat b{display:block; font-size:22px; font-weight:500; color:var(--t1); line-height:1.2}
  .stat span{font-size:11.5px; color:var(--t3)}
  .verified{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:3px 9px; border-radius:999px; margin-bottom:10px}
  .verified.ok{color:#7FD1A4; background:rgba(111,207,151,.1); border:1px solid rgba(111,207,151,.25)}
  .verified.draft{color:var(--t3); background:#171A22; border:1px solid var(--line)}
  .peer{font-size:13.5px; color:var(--t2); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:14px}
  .peer b{color:var(--gold); font-weight:500}
  .hint{font-size:13.5px; color:var(--t3); line-height:1.9}

  /* 星详情：四大板块 */
  .np-head{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .np-head .verified{margin-bottom:0}
  .back-btn{margin-left:auto; padding:5px 11px; border:1px solid var(--line); border-radius:8px;
    background:transparent; color:var(--t2); font-size:12px; cursor:pointer; font-family:inherit; transition:.16s}
  .back-btn:hover{color:var(--t1); border-color:#3F4553; background:#171A22}
  .back-btn:active{transform:translateY(1px)}
  .sub{font-size:11.5px; color:var(--t3); letter-spacing:.5px; margin:14px 0 6px}
  .p-prob{font-size:13.5px; color:var(--t2); line-height:1.85; margin:0;
    border-left:2px solid #5B9BD5; padding:2px 0 2px 12px}
  .resolved{font-size:13px; border-radius:9px; padding:11px 13px; margin:4px 0 0; line-height:1.75; border:1px solid var(--line)}
  .resolved.ok{color:#9BE8B8; background:rgba(111,207,151,.08); border-color:rgba(111,207,151,.28)}
  .resolved.ok b{color:#7FD1A4}
  .resolved.no{color:#F0A79E; background:rgba(224,121,110,.08); border-color:rgba(224,121,110,.28)}
  .resolved.no b{color:#E0796E}
  .tried{margin:8px 0 0; padding:0; list-style:none}
  .tried li{position:relative; padding:7px 0 7px 22px; font-size:13px; color:var(--t2); border-bottom:1px solid #1C1F29; line-height:1.65}
  .tried li:last-child{border-bottom:0}
  .tried li:before{content:""; position:absolute; left:5px; top:13px; width:6px; height:6px; border-radius:50%; background:#E0796E}
  .ai-summary{font-size:13.5px; color:var(--t1); background:#0E1016; border:1px solid var(--line);
    border-left:3px solid var(--gold); border-radius:8px; padding:12px 14px; line-height:1.85; margin-top:2px; white-space:pre-wrap}
  .help-log{margin-top:4px}
  .help-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #1C1F29}
  .help-item:last-child{border-bottom:0}
  .hi-dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex:0 0 8px; background:var(--gold); box-shadow:0 0 6px var(--gold)}
  .hi-body{font-size:13px; color:var(--t2); line-height:1.7}

  /* 反馈闭环 UI */
  .fb-row{display:flex; gap:10px; margin:16px 0 6px}
  .fb-btn{flex:1; padding:11px 10px; border-radius:10px; border:1px solid var(--line); background:#171A22; color:var(--t1); font-size:13.5px; cursor:pointer; font-family:inherit; transition:.2s}
  .fb-btn.solve{border-color:#6FCF97; color:#9BE8B8}
  .fb-btn.solve:hover{background:rgba(111,207,151,.14)}
  .fb-btn.unsolve{border-color:#E0796E; color:#F0A79E}
  .fb-btn.unsolve:hover{background:rgba(224,121,110,.14)}
  .fb-note{font-size:13px; color:#7FD1A4; margin:6px 0 4px}
  .flow{border-left:2px solid var(--gold); padding:6px 0 6px 14px; margin:12px 0}
  .flow h4{margin:0 0 6px; font-size:14px; color:var(--gold); font-weight:500}
  .flow p{margin:0 0 10px; font-size:13.5px; color:var(--t2); line-height:1.8}
  .chk{display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--t2); margin:7px 0; line-height:1.6}
  .chk input{margin-top:3px; accent-color:#6FCF97; flex:0 0 auto}
  .help-btns{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0}
  .chip-btn{padding:8px 13px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--t2); font-size:12.5px; cursor:pointer; font-family:inherit; transition:.2s}
  .chip-btn:hover{color:var(--t1); border-color:#3F4553; background:#171A22}
  .help-box{width:100%; height:148px; background:#0E1016; border:1px solid var(--line); border-radius:8px; color:var(--t2); font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace; padding:11px; resize:none; margin-top:4px}
  .copy-btn{margin-top:8px; padding:8px 14px; border:1px solid var(--gold); border-radius:8px; background:transparent; color:var(--gold); font-size:12.5px; cursor:pointer; font-family:inherit}
  .copy-btn:hover{background:var(--gold); color:#1A1508}

  footer{
    border-top:1px solid var(--line); padding:10px 22px; display:flex; align-items:center;
    gap:26px; flex-wrap:wrap; background:rgba(10,11,15,.7); font-size:11.5px; color:var(--t3);
  }
  .lg{display:flex; align-items:center; gap:7px}
  .lg i{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--gold)}
  .lg.solid i{background:#6FCF97}
  .lg.hollow i{background:transparent; border:1.6px solid #E0796E}
  .lg small{color:var(--t3)}

  .toast{
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px); z-index:5;
    background:rgba(231,184,115,.12); border:1px solid rgba(231,184,115,.4); color:var(--gold);
    padding:9px 18px; border-radius:999px; font-size:13px; opacity:0; transition:.35s;
    pointer-events:none; backdrop-filter:blur(4px); white-space:nowrap;
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

  /* --- svg 星辰图 --- */
  .orbit{fill:none; stroke-width:1; opacity:.16; stroke-dasharray:2 8}
  .ray{fill:none; stroke-width:1; opacity:.30}
  .ray.hot{opacity:.95; stroke-width:1.9}
  .xlink{stroke:#39414F; stroke-width:1; opacity:.28; stroke-dasharray:3 5}
  .node{cursor:pointer}
  .pop{transform:scale(var(--s,1)); transform-box:fill-box; transform-origin:center; transition:transform .2s cubic-bezier(.34,1.4,.64,1), filter .25s ease}
  .node.on .pop{filter:drop-shadow(0 0 5px var(--nc)) drop-shadow(0 0 11px var(--nc))}
  .star{stroke-linejoin:round; filter:drop-shadow(0 0 4px var(--nc)); pointer-events:all}
  .nhit{pointer-events:all; cursor:pointer}
  .star.on{filter:drop-shadow(0 0 7px var(--nc)) drop-shadow(0 0 13px var(--nc))}
  .node.on .star{filter:drop-shadow(0 0 9px var(--nc)) drop-shadow(0 0 18px var(--nc))}
  .star.tw{animation:tw 4.5s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.78}}
  .node.on .lbl{font-size:14px; fill:#FFF; stroke-width:6}
  .lbl{font-size:12.5px; font-weight:500; letter-spacing:.3px; fill:#D6D2C9; paint-order:stroke; stroke:#0A0B0F; stroke-width:5; stroke-linejoin:round; transition:fill .2s}
  .node-detail{font-size:10.5px; fill:#6B6862; paint-order:stroke; stroke:#0A0B0F; stroke-width:4.5; stroke-linejoin:round}
  .sun-glow{opacity:.92}
  .varc{opacity:.55}
  .core-title{font-size:17.5px; font-weight:600; letter-spacing:.4px; fill:#F5F2EB}
  .core-sub{font-size:12.5px; fill:#8B877F}
  .core-num{font-size:13px; fill:var(--gold); font-weight:600}
  .core-hint{font-size:11px; fill:#6B6862; letter-spacing:.5px}
  #corehit{cursor:pointer}
  .origin-chip{font-size:11px; fill:#948F86}
  .origin-box{fill:#141620; stroke:#2A2E3A; stroke-width:1}
  @keyframes ripple{0%{r:6;opacity:.6}100%{r:54;opacity:0}}
  .ripple{fill:none; stroke:var(--gold); stroke-width:1.6; animation:ripple 1.1s ease-out forwards}

  #web{cursor:grab; touch-action:none}
  #web.grabbing{cursor:grabbing}
  .zoombar{position:absolute; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:5}
  .zoombar button{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
    background:rgba(20,22,32,.85); color:var(--t2); font-size:16px; line-height:1;
    cursor:pointer; backdrop-filter:blur(6px); transition:.18s; font-family:inherit; padding:0;
  }
  .zoombar button.sm{font-size:11px}
  .zoombar button:hover{color:var(--t1); border-color:#3F4553; background:rgba(32,35,46,.9)}
  .zoomtag{position:absolute; left:18px; bottom:18px; font-size:11.5px; color:var(--t3); border:1px solid var(--line); border-radius:999px; padding:5px 13px; background:rgba(20,22,32,.72); backdrop-filter:blur(6px); letter-spacing:.5px; z-index:5}
  .zoomtag b{color:var(--gold); font-weight:500}
  .hintbar{position:absolute; left:18px; top:16px; font-size:11.5px; color:var(--t3); line-height:1.9; pointer-events:none; z-index:5}
  .hintbar b{color:var(--t2); font-weight:400}

  svg.lod1 .nfix, svg.lod1 .node-detail{display:none}
  svg.lod1 .node.on .lbl{display:inline}
  svg.lod2 .node-detail{display:none}
  svg.locked .node:not(.on){opacity:.42; transition:opacity .38s ease}
  svg.locked .ray:not(.hot){opacity:.05}
  svg.locked .orbit{opacity:.04}
  svg.locked .xlink{opacity:.03}
  svg.locked .sun-glow{opacity:.25}
  svg.locked .corec{opacity:.18}
  svg.locked .fix{opacity:.25}
  svg.lod3 .nfix{opacity:1}
</style>
</head>

function dProb(nd){ const d=nd.diffs&&nd.diffs[0]; return d? `${nd.sit}　与原帖最大的不同在「${d[0]}」：原帖是「${d[1]}」，你这里是「${d[2]}」，结果${d[3]}。` : nd.sit; }
function dHow(nd){ const m=nd.moves||[]; let s=''; if(m[0]) s+=`按 AI 建议的「${m[0][0]}」落地：${m[0][1]}`; if(m[1]) s+='；再配合「'+m[1][0]+'」'+m[1][1]+'。'; return s||'按 AI 给的方案落地并验证通过。'; }
function dTried(nd){ return (nd.moves||[]).map(m=>'试过「'+m[0]+'」：'+m[1]); }
function dAI(nd){ const t=((POSTS[cur]&&POSTS[cur].title)||'').split('：')[0].split(':')[0]; return `想把原帖的「${t}」方案，搬进「${nd.n}」这个真实处境——${nd.sit}。希望得到一个能落地的改法，而不是从头重写。`; }
function dHelp(nd){ const d=nd.diffs&&nd.diffs[0]; const m0=(nd.moves&&nd.moves[0]&&nd.moves[0][0])||'核心改法'; const v=nd.v||verified.has(nd.n);
  return [ `AI 针对「${nd.n}」重做了方案，把差异点落在「${d?d[0]:'场景'}」（${d?d[1]+' → '+d[2]:''}）`, `已对接原帖作者与相关圈子，确认「${m0}」在你的处境下可行`, v?'陪跑联调并验证通过，原帖价值加 1':'仍在跟进，等你把真实报错补全后进一步定位' ]; }

/* ---------- 布局（倾斜星盘） ---------- */
let seq=0;
const DEPTH_COLOR=[null,'#6FCF97','#E7B873','#E0796E'];
/* 星形只表达两件事：已验证（实心绿星）/ 待验证（空心红星）。
   颜色专门用于「是否验证通过」；迁移深度改用轨道环的远近表示。 */
const STAR_ON='#6FCF97', STAR_OFF='#E0796E';
const DEPTH_NAME=['','改参数','改结构','换方案'];
const RAD=Math.PI/180;
const verified=new Set();           // 已被用户验证的场景名
function allScenes(post){
  if(post.scenes) return post.scenes;
  const out=[];
  (post.sectors||[]).forEach(s=>s.scenes.forEach(sc=>out.push(sc)));
  return out;
}
function starPath(R, r){
  let p=[];
  for(let i=0;i<8;i++){
    const a=(-90+i*45)*RAD, rad=(i%2===0)?R:r;
    p.push((Math.cos(a)*rad).toFixed(2)+' '+(Math.sin(a)*rad).toFixed(2));
  }
  return 'M'+p.join(' L')+' Z';
}
function relaxAngles(pos){
  const MIN=104;
  for(let it=0; it<240; it++){
    let moved=false;
    for(let a=0;a<pos.length;a++){
      for(let b=a+1;b<pos.length;b++){
        const A=pos[a], B=pos[b];
        const ax=CX+A.r*Math.cos(A.ang*RAD), ay=CY+A.r*Math.sin(A.ang*RAD);
        const bx=CX+B.r*Math.cos(B.ang*RAD), by=CY+B.r*Math.sin(B.ang*RAD);
        const d=Math.hypot(bx-ax, by-ay);
        if(d>=MIN || d<0.001) continue;
        moved=true;
        const half=(MIN-d)*0.55;
        const da=half/Math.max(A.r*RAD,1);
        const db=half/Math.max(B.r*RAD,1);
        if(A.ang<B.ang){ A.ang-=da; B.ang+=db; } else { A.ang+=da; B.ang-=db; }
      }
    }
    if(!moved) break;
  }
}
function layout(post){
  const list=allScenes(post);
  const pos=list.map((sc,i)=>({ang:0, r:RING[sc.d]||RING[2], sc, idx:i}));
  const groups={1:[],2:[],3:[]};
  list.forEach((sc,i)=>{ (groups[sc.d]||groups[2]).push(i); });
  [1,2,3].forEach((d,gi)=>{
    const g=groups[d], n=g.length;
    if(!n) return;
    const step=360/n, phase=-90+gi*(step/3);
    g.forEach((idx,k)=>{ pos[idx].ang=phase+step*k; });
  });
  relaxAngles(pos);
  return pos.map((p,i)=>{
    const rad=p.ang*RAD;
    const rOff=((i*41)%17);                // 0..16，确定性地向外推
    const r2=p.r+20+rOff*3;                // 一律推离轨道环外侧（+20..+68），不再贴在环上
    const x=CX+r2*Math.cos(rad);
    const y=CY+r2*Math.sin(rad)*SQUASH;
    return {...p.sc, idx:i, color:DEPTH_COLOR[p.sc.d]||'#E7B873',
      id:'n'+(seq++), ang:p.ang, r:r2, x, y};
  });
}

function ptOn(cx,cy,r,a){const t=a*Math.PI/180;return [cx+r*Math.cos(t), cy+r*Math.sin(t)];}
function arcPath(cx,cy,r,a1,a2){
  const [x1,y1]=ptOn(cx,cy,r,a1), [x2,y2]=ptOn(cx,cy,r,a2);
  const large=Math.abs(a2-a1)>180?1:0;
  return `M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
}

/* 入场：太阳亮起 + 星点依次点亮 */
function growIn(){
  if(!window.Element.prototype.animate) return;
  const STAG=46, DUR=480, BASE=160;
  const order=[...nodes].sort((a,b)=>a.idx-b.idx);
  order.forEach(nd=>{
    const delay=BASE + nd.idx*STAG;
    const p=svg.querySelector(`.ray[data-rad="${nd.id}"]`);
    if(p){
      const len=Math.hypot(nd.x-CX, nd.y-CY);
      p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
      const an=p.animate([{strokeDashoffset:len},{strokeDashoffset:0}],
        {duration:DUR, delay, easing:'cubic-bezier(.3,0,.2,1)', fill:'backwards'});
      an.onfinish=()=>{p.style.strokeDasharray=''; p.style.strokeDashoffset='';};
    }
    const g=svg.querySelector(`.node[data-id="${nd.id}"]`);
    if(g){
      const pop=g.querySelector('.pop');
      if(pop) pop.animate([{transform:'scale(0)'},{transform:'scale(1)'}],
        {duration:460, delay:delay+DUR*0.4, easing:'cubic-bezier(.34,1.56,.64,1)', fill:'backwards'});
      g.querySelectorAll('.nfix').forEach(t=>{
        t.animate([{opacity:0},{opacity:1}],{duration:300, delay:delay+DUR*0.7, easing:'ease-out', fill:'backwards'});
      });
    }
  });
  svg.querySelectorAll('.corec').forEach((e,i)=>{
    e.animate([{transform:'scale(0)',opacity:0},{transform:'scale(1)',opacity:1}],
      {duration:640, delay:i*70, easing:'cubic-bezier(.34,1.56,.64,1)', fill:'backwards'});
  });
  svg.querySelectorAll('.sun-glow').forEach(e=>{
    e.animate([{opacity:0},{opacity:.92}],{duration:680, delay:0, easing:'ease-out', fill:'backwards'});
  });
  /* 先把太阳拉到中心、亮起来，之后再显示中心文字 */
  svg.querySelectorAll('.core-txt').forEach(e=>{
    e.animate([{opacity:0},{opacity:1}],{duration:560, delay:660, easing:'cubic-bezier(.22,1,.36,1)', fill:'backwards'});
  });
  // 原帖约束胶囊入场动画已随胶囊移除
}

function applyFE(){
  const act=hover||lock;
  for(const {pop,id} of fePairs){
    const nd=nodeById.get(id);
    if(!nd) continue;
    let s=1;
    if(mouseC){
      const d=Math.hypot(nd.x-mouseC.x, nd.y-mouseC.y);
      if(d<FE_R) s=1+0.5*Math.pow(1-d/FE_R,1.5);
    }
    if(id===act) s=Math.max(s,2.0);
    pop.style.setProperty('--s', s.toFixed(3));
  }
}
function scheduleFE(){ if(!feRaf) feRaf=requestAnimationFrame(()=>{feRaf=null; applyFE();}); }

function bind(){
  svg.querySelectorAll('.node').forEach(g=>{
    const nd=nodes.find(x=>x.id===g.dataset.id);
    g.addEventListener('mouseenter',()=>{hover=nd.id; paint();});
    g.addEventListener('mouseleave',()=>{hover=null; paint();});
  });
  // 点按交互改在 pointerup（endPointer→handleTap）里处理：
  // setPointerCapture 会让「按下/抬起目标不一致」，浏览器据此抑制 click 事件，
  // 所以不能再依赖 click/dblclick，改为 pointerup 时 elementFromPoint 取真实元素。
  svg.addEventListener('mouseleave',()=>{ if(hover){hover=null; paint();} });
}

const LODNAME=['','总览','星图','细节'];
function applyZoom(){
  if(!vp) return;
  const c=1/Math.sqrt(k), inv=1/k;
  vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${k})`);
  for(const g of fxEls) g.setAttribute('transform',`translate(${g.dataset.x} ${g.dataset.y}) scale(${inv})`);
  for(const g of nwEls) g.setAttribute('transform',`translate(${g.dataset.x} ${g.dataset.y}) scale(${c})`);
  for(const t of nfEls) t.setAttribute('transform',`translate(${t.dataset.dx} ${t.dataset.dy}) scale(${c})`);
  const lod = k<0.8?1:(k<1.6?2:3);
  svg.classList.remove('lod1','lod2','lod3');
  svg.classList.add('lod'+lod);
  const tag=document.getElementById('ztag');
  if(tag) tag.innerHTML=`${LODNAME[lod]} · <b>${k.toFixed(1)}x</b>`;
}
function sPt(e){const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse());}
function cPt(e){const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(vp.getScreenCTM().inverse());}
const clamp=v=>Math.min(KMAX,Math.max(KMIN,v));
function zoomAt(nk, sx, sy, cx, cy){ nk=clamp(nk); if(nk===k) return; k=nk; tx=sx-cx*k; ty=sy-cy*k; applyZoom(); }
function animateTo(nk,ntx,nty,dur=340){
  const k1=k, tx1=tx, ty1=ty, t0=performance.now();
  (function step(t){
    const p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,3);
    k=k1+(nk-k1)*e; tx=tx1+(ntx-tx1)*e; ty=ty1+(nty-ty1)*e; applyZoom();
    if(p<1) requestAnimationFrame(step);
  })(performance.now());
}
function zoomBy(f){ const c={x:(CX-tx)/k, y:(CY-ty)/k}; const nk=clamp(k*f); animateTo(nk, CX-c.x*nk, CY-c.y*nk); }
function resetView(){ fitView(); }
function fitView(){
  if(!nodes.length) return;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  nodes.forEach(n=>{
    const cos=Math.cos(n.ang*RAD);
    const w=n.n.length*11+12, h=20;
    const anchor=cos>0.18?'start':(cos<-0.18?'end':'middle');
    const lx=n.x+cos*16+(anchor==='start'?0:(anchor==='end'?-w:-w/2));
    minX=Math.min(minX, Math.min(n.x-13, lx-4));
    maxX=Math.max(maxX, Math.max(n.x+13, lx+w+4));
    minY=Math.min(minY, n.y-17);
    maxY=Math.max(maxY, n.y+17);
  });
  const pad=58; minX-=pad; maxX+=pad; minY-=pad; maxY+=pad;
  const raw=Math.min(900/(maxX-minX), 790/(maxY-minY));
  const nk=Math.min(Math.max(raw, KMIN), 1.45);
  const ccx=(minX+maxX)/2, ccy=(minY+maxY)/2;
  animateTo(nk, CX-ccx*nk, CY-ccy*nk, 560);
}
function focusNode(nd, nk){ nk=clamp(nk||2.55); animateTo(nk, CX-nd.x*nk, CY-nd.y*nk, 560); }

svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const sp=sPt(e), cp=cPt(e);
  const f=Math.exp(-e.deltaY*(e.ctrlKey?0.011:0.0022));
  zoomAt(k*f, sp.x, sp.y, cp.x, cp.y);
},{passive:false});

let dragging=false, moved=0, lastPt=null;
const touches=new Map();
let pinch0=0, k0=1, anchorS={x:0,y:0}, anchorC={x:0,y:0};
svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse' && e.button!==0) return;
  touches.set(e.pointerId,{s:sPt(e), c:cPt(e)});
  if(touches.size===2){
    const [a,b]=[...touches.values()];
    pinch0=Math.hypot(a.s.x-b.s.x, a.s.y-b.s.y)||1; k0=k;
    anchorS={x:(a.s.x+b.s.x)/2, y:(a.s.y+b.s.y)/2};
    anchorC={x:(a.c.x+b.c.x)/2, y:(a.c.y+b.c.y)/2};
    dragging=false; return;
  }
  dragging=true; moved=0; lastPt=sPt(e);
  svg.classList.add('grabbing');
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
});
svg.addEventListener('pointermove',e=>{
  mouseC=cPt(e); scheduleFE();
  if(touches.has(e.pointerId)) touches.set(e.pointerId,{s:sPt(e), c:touches.get(e.pointerId).c});
  if(touches.size===2){
    const [a,b]=[...touches.values()];
    const d=Math.hypot(a.s.x-b.s.x, a.s.y-b.s.y)||1;
    zoomAt(k0*d/pinch0, anchorS.x, anchorS.y, anchorC.x, anchorC.y); return;
  }
  if(!dragging) return;
  const p=sPt(e), dx=p.x-lastPt.x, dy=p.y-lastPt.y;
  moved+=Math.abs(dx)+Math.abs(dy);
  tx+=dx; ty+=dy; lastPt=p; applyZoom();
});
function endPointer(e){
  touches.delete(e.pointerId);
  if(touches.size<2) pinch0=0;
  if(dragging){
    dragging=false; svg.classList.remove('grabbing');
    const wasDrag = moved>4;
    justDragged = wasDrag; setTimeout(()=>{justDragged=false;},0);
    // 没有发生拖拽 = 这是一次「点按」，此时浏览器因 pointer 捕获不会派发 click，
    // 所以直接在 pointerup 里用 elementFromPoint 还原真实目标并执行点击逻辑。
    if(!wasDrag) handleTap(e.clientX, e.clientY);
  }
  try{svg.releasePointerCapture(e.pointerId);}catch(_){}
}
// 点按逻辑（替代被 pointer 捕获抑制的 click 事件）：用屏幕坐标找回真实星点/太阳
function handleTap(cx, cy){
  const el=document.elementFromPoint(cx, cy);
  const g=el && el.closest('.node');
  if(g){
    const nd=nodes.find(x=>x.id===g.dataset.id);
    if(!nd) return;
    if(lock===nd.id){ lock=null; hover=null; paint(); showOverview(); fitView(); }
    else { lock=nd.id; paint(); showNode(nd,true); focusNode(nd); }
    return;
  }
  if(el && el.closest('#corehit')){ lock=null; hover=null; paint(); showOrigin(); fitView(); return; }
  lock=null; paint(); showOverview(); fitView();
}
svg.addEventListener('pointerup',endPointer);
svg.addEventListener('pointercancel',endPointer);
svg.addEventListener('pointerleave',()=>{mouseC=null; scheduleFE();});

function paint(){

  applyFE();
  syncBrowseSel();
}

   diffs:[['交付','自用','上游合并','不能破坏现有 API']],moves:[['保持接口向后兼容','新增可选路径'],['补单元测试','证明不回归']]}
];
document.getElementById('grow').onclick=()=>{
  if(grown>=POOL.length){return;}
  const sc=POOL[grown++];
  const post=POSTS[cur];
  const target=post.sectors[sc.s%post.sectors.length];
  target.scenes.push(sc);
  render();
  const nd=nodes.find(x=>x.n===sc.n);
  if(!nd){return;}
  const g=svg.querySelector(`.node[data-id="${nd.id}"]`);
  const len=Math.hypot(nd.x-CX, nd.y-CY);
  const t0=performance.now(), dur=900, x0=CX, y0=CY;
  function step(t){
    const kk=Math.min((t-t0)/dur,1);
    const e=1-Math.pow(1-kk,3);
    const cx=CX+(nd.x-CX)*e, cy=CY+(nd.y-CY)*e;
    g.setAttribute('transform',`translate(${x0-cx} ${y0-cy})`);
    g.style.opacity=String(0.2+0.8*e);
    if(kk<1){requestAnimationFrame(step);}
    else{
      g.removeAttribute('transform'); g.style.opacity='1';
      const rip=document.createElementNS(svg.namespaceURI,'circle');
      rip.setAttribute('cx',nd.x); rip.setAttribute('cy',nd.y); rip.setAttribute('r',6); rip.setAttribute('class','ripple');
      vp.appendChild(rip); setTimeout(()=>rip.remove(),1200);
      showNode(nd,true); lock=nd.id; paint(); focusNode(nd);
    }
  }
  requestAnimationFrame(step);
  toast(`星图因你 +1　现在是第 ${nodes.length} 颗星`);
  if(grown>=POOL.length) document.getElementById('grow').disabled=true;
};

let tt;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>toastEl.classList.remove('on'),2600); }

makeStarfield();
render(true); showOverview(); fitView();
</script>
